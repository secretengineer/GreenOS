; PlatformIO Project Configuration File for GreenOS
; ESP32-WROOM-32E Platform
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_ESP32_DEV
    -DESP32

; Upload settings
upload_speed = 921600

; Exclude old Arduino UNO Q code
build_src_filter = +<*> -<main/>

; Partition scheme for OTA updates and SPIFFS
board_build.partitions = default.csv
board_build.filesystem = spiffs

; Library dependencies
lib_deps = 
    ; Firebase
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.14
    
    ; Sensors
    sparkfun/SparkFun SCD30 Arduino Library@^1.0.20
    adafruit/Adafruit Unified Sensor@^1.1.14
    
    ; Modbus RTU for soil sensors
    4-20ma/ModbusMaster@^2.0.1
    
    ; JSON handling
    bblanchon/ArduinoJson@^7.0.4
    
    ; NTP time sync
    arduino-libraries/NTPClient@^3.2.1
    
    ; WiFi Manager for easy configuration
    tzapu/WiFiManager@^2.0.17

; Extra library storage paths
lib_extra_dirs = lib

[env:esp32dev_debug]
extends = env:esp32dev
build_type = debug
build_flags = 
    ${env:esp32dev.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_MODE=1

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = greenos.local
upload_flags = 
    --port=3232
    --auth=${sysenv.GREENOS_OTA_PASSWORD}
